name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30m
          script: |
            set -e

            cd $HOME/SportEase

            git fetch origin
            git merge origin/main

            docker compose -f docker-compose.production.yml up -d sportease-db

            docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'i=0; until mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent; do i=$((i + 1)); if [ "$i" -ge 60 ]; then exit 1; fi; sleep 2; done'

            mkdir -p "$HOME/db-backups"
            docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'mysqldump -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
              > "$HOME/db-backups/sportease_before_deploy_$(date +%Y%m%d_%H%M%S).sql"

            docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -e "
              CREATE TABLE IF NOT EXISTS schema_migrations (version bigint not null primary key, dirty boolean not null);
              INSERT INTO schema_migrations (version, dirty)
              SELECT
                CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM information_schema.tables
                    WHERE table_schema = DATABASE()
                      AND table_name = '\''round_check_ins'\''
                  ) THEN 3
                  ELSE 2
                END,
                false
              WHERE NOT EXISTS (SELECT 1 FROM schema_migrations)
                AND EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE()
                    AND table_name = '\''guide_documents'\''
                );
            "'

            docker compose -f docker-compose.production.yml --profile migration run --rm migrate

            docker compose -f docker-compose.production.yml build --no-cache
            docker compose -f docker-compose.production.yml up -d --build

            sleep 10

            docker compose -f docker-compose.production.yml up -d --build
