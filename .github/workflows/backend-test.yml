name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ci/auto-test

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Go Tests
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
      SPORTEASE_TEST_MYSQL_DSN: 'root@tcp(127.0.0.1:3306)/?parseTime=true'
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          check-latest: true
          cache-dependency-path: 'backapp/go.sum'

      - name: Set up Takumi Guard
        uses: flatt-security/setup-takumi-guard-golang@37631ecffa6faf06754444a4807451b7a55c64b5 # v1

      - name: Install dependencies
        working-directory: ./backapp
        run: go mod download

      - name: Run tests with race detector and coverage
        working-directory: ./backapp
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Publish coverage summary
        working-directory: ./backapp
        run: |
          {
            echo "## Backend Coverage"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            backapp/coverage.out
            backapp/coverage.txt
