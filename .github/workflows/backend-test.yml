name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ci/auto-test

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          check-latest: true
          cache-dependency-path: 'backapp/go.sum'

      - name: Set up Takumi Guard
        uses: flatt-security/setup-takumi-guard-golang@37631ecffa6faf06754444a4807451b7a55c64b5 # v1

      - name: Install dependencies
        working-directory: ./backapp
        run: go mod download

      - name: Check known vulnerabilities
        working-directory: ./backapp
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      - name: Run all package tests
        working-directory: ./backapp
        run: go test -v ./...

      - name: Run unit tests
        working-directory: ./backapp
        run: |
          go test -v ./tests/handler/... ./tests/repository/... ./internal/websocket/...

      - name: Run race detector
        working-directory: ./backapp
        run: |
          go test -race -v ./tests/handler/... ./tests/repository/... ./internal/websocket/...

      - name: Generate coverage report
        working-directory: ./backapp
        run: |
          go test -v -covermode=atomic -coverprofile=coverage.out \
            -coverpkg=backapp/internal/handler,backapp/internal/repository,backapp/internal/websocket \
            ./tests/handler/... ./tests/repository/... ./internal/websocket/...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Publish coverage summary
        working-directory: ./backapp
        run: |
          {
            echo "## Backend Coverage"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            backapp/coverage.out
            backapp/coverage.txt
