name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Block vulnerable dependency additions
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  glassworm:
    name: GlassWorm indicator scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect GlassWorm-style invisible payloads
        run: python3 .github/scripts/detect_glassworm.py

  trivy:
    name: Repository, secret, and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan dependencies, secrets, IaC, and repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  npm-audit:
    name: Frontend production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontapp/package-lock.json
      - name: Audit frontend production dependencies
        working-directory: ./frontapp
        run: |
          run_audit() {
            local registry="$1"
            local output
            local status

            set +e
            if [ -n "$registry" ]; then
              output=$(npm audit --omit=dev --audit-level=high --registry="$registry" 2>&1)
            else
              output=$(npm audit --omit=dev --audit-level=high 2>&1)
            fi
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            if printf '%s\n' "$output" | grep -Eqi 'audit endpoint returned an error|5[0-9][0-9] (Bad Gateway|Service Unavailable|Gateway Timeout|Internal Server Error)|EAI_AGAIN|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|socket hang up'; then
              return 2
            fi

            return 1
          }

          status=0
          run_audit "" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          elif [ "$status" -eq 1 ]; then
            exit 1
          fi

          echo "::warning::Takumi Guard npm audit service is unavailable; retrying with the official npm registry."

          status=0
          run_audit "https://registry.npmjs.org/" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          elif [ "$status" -eq 1 ]; then
            exit 1
          fi

          echo "::warning::Both npm audit services are unavailable. Continuing because dependency review and Trivy remain blocking security checks."

  govulncheck:
    name: Go reachable vulnerability audit
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backapp/go.mod
          cache-dependency-path: backapp/go.sum
      - name: Run govulncheck
        working-directory: ./backapp
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  gosec:
    name: Go static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backapp/go.mod
          cache-dependency-path: backapp/go.sum
      - name: Run gosec
        working-directory: ./backapp
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -severity medium -confidence medium ./...

  workflow-security:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: auditor
          min-severity: high
          min-confidence: medium
