name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests before release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backapp/go.mod
          cache-dependency-path: backapp/go.sum
      - name: Run backend tests with race detector
        working-directory: ./backapp
        run: go test -race -count=1 ./...

  frontend-tests:
    name: Frontend tests before release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontapp/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: ./frontapp
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontapp
        run: npx playwright install --with-deps chromium
      - name: Run frontend checks
        working-directory: ./frontapp
        run: |
          npm run lint
          npm run test
          npm run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Block vulnerable dependency additions
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  glassworm:
    name: GlassWorm indicator scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect GlassWorm-style invisible payloads
        run: python3 .github/scripts/detect_glassworm.py

  trivy:
    name: Repository, secret, and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan dependencies, secrets, IaC, and repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  npm-audit:
    name: Frontend dependency and lockfile audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontapp/package-lock.json
      - name: Verify lockfile without running package scripts
        working-directory: ./frontapp
        run: npm ci --ignore-scripts --no-audit
      - name: Audit all frontend dependencies
        working-directory: ./frontapp
        run: |
          run_audit() {
            local registry="$1"
            local output
            local status

            set +e
            if [ -n "$registry" ]; then
              output=$(npm audit --audit-level=high --registry="$registry" 2>&1)
            else
              output=$(npm audit --audit-level=high 2>&1)
            fi
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            if printf '%s\n' "$output" | grep -Eqi 'audit endpoint returned an error|5[0-9][0-9] (Bad Gateway|Service Unavailable|Gateway Timeout|Internal Server Error)|EAI_AGAIN|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|socket hang up'; then
              return 2
            fi

            return 1
          }

          status=0
          run_audit "" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          elif [ "$status" -eq 1 ]; then
            exit 1
          fi

          echo "::warning::Takumi Guard npm audit service is unavailable; retrying with the official npm registry."

          status=0
          run_audit "https://registry.npmjs.org/" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          elif [ "$status" -eq 1 ]; then
            exit 1
          fi

          echo "::error::Both npm audit services are unavailable. Failing closed so an unavailable scanner cannot silently pass."
          exit 1

  govulncheck:
    name: Go reachable vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backapp/go.mod
          cache-dependency-path: backapp/go.sum
      - name: Run govulncheck
        working-directory: ./backapp
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  gosec:
    name: Go static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backapp/go.mod
          cache-dependency-path: backapp/go.sum
      - name: Run gosec
        working-directory: ./backapp
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -severity medium -confidence low ./...

  # CodeQL is managed by the repository's default setup. GitHub does not allow
  # default setup and an advanced workflow configuration to upload together.
  workflow-security:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: auditor
          min-severity: medium
          min-confidence: medium

  deploy:
    name: Deploy to Server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - frontend-tests
      - glassworm
      - trivy
      - npm-audit
      - govulncheck
      - gosec
      - workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions: {}
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30m
          envs: TARGET_SHA
          script: |
            set -e

            cd "$HOME/SportEase"

            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"

            docker compose -f docker-compose.production.yml up -d sportease-db

            docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'i=0; until mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent; do i=$((i + 1)); if [ "$i" -ge 60 ]; then exit 1; fi; sleep 2; done'

            mkdir -p "$HOME/db-backups"
            docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'mysqldump -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
              > "$HOME/db-backups/sportease_before_deploy_$(date +%Y%m%d_%H%M%S).sql"

            docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -e "
              CREATE TABLE IF NOT EXISTS schema_migrations (version bigint not null primary key, dirty boolean not null);
              INSERT INTO schema_migrations (version, dirty)
              SELECT
                CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM information_schema.tables
                    WHERE table_schema = DATABASE()
                      AND table_name = '\''round_check_ins'\''
                  ) THEN 3
                  ELSE 2
                END,
                false
              WHERE NOT EXISTS (SELECT 1 FROM schema_migrations)
                AND EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE()
                    AND table_name = '\''guide_documents'\''
                );
            "'

            dirty_16="$(docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM schema_migrations WHERE version = 16 AND dirty = TRUE;"')"
            if [ "$dirty_16" = "1" ]; then
              docker compose -f docker-compose.production.yml exec -T sportease-db sh -c 'mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
                < backapp/db/recovery/0016_dirty_recovery.sql
            fi

            docker compose -f docker-compose.production.yml --profile migration run --rm migrate

            docker compose -f docker-compose.production.yml build --no-cache
            docker compose -f docker-compose.production.yml up -d --build

            sleep 10

            docker compose -f docker-compose.production.yml up -d --build
