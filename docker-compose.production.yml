services:
  sportease-db:
    image: mysql:8.0
    container_name: sportease-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./backapp/db/conf.d:/etc/mysql/conf.d
    networks:
      - spotease-internal
    restart: always
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    profiles:
      - migration
    volumes:
      - ./backapp/db/migrations:/migrations:ro
    depends_on:
      sportease-db:
        condition: service_healthy
    command:
      [
        "-path", "/migrations",
        "-database", "mysql://${DB_USER}:${DB_PASSWORD}@tcp(sportease-db:3306)/${DB_DATABASE}?multiStatements=true",
        "up"
      ]
    networks:
      - spotease-internal

  sportease-redis:
    image: redis:7-alpine
    container_name: sportease-redis
    networks:
      - spotease-internal
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sportease-backapp:
    build:
      context: ./backapp
    container_name: sportease-backapp
    env_file:
      - .env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      sportease-db:
        condition: service_healthy
      sportease-redis:
        condition: service_healthy
    environment:
      - DB_HOST=sportease-db
      - DB_PORT=3306
      - REDIS_ADDR=sportease-redis:6379
      - APP_ENV=production
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    networks:
      - proxy
      - spotease-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sportease-public"
      - "traefik.http.routers.sportease-uploads.rule=Host(`nitsche-gyouji.com`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.sportease-uploads.entrypoints=websecure"
      - "traefik.http.routers.sportease-uploads.tls=true"
      - "traefik.http.routers.sportease-uploads.tls.certresolver=myresolver"
      - "traefik.http.routers.sportease-uploads.service=sportease-uploads"
      - "traefik.http.services.sportease-uploads.loadbalancer.server.port=8080"
      - "traefik.http.routers.sportease-websocket.rule=Host(`nitsche-gyouji.com`) && PathPrefix(`/api/ws`)"
      - "traefik.http.routers.sportease-websocket.entrypoints=websecure"
      - "traefik.http.routers.sportease-websocket.tls=true"
      - "traefik.http.routers.sportease-websocket.tls.certresolver=myresolver"
      - "traefik.http.routers.sportease-websocket.priority=100"
      - "traefik.http.routers.sportease-websocket.service=sportease-websocket"
      - "traefik.http.services.sportease-websocket.loadbalancer.server.port=8080"

  sportease-frontapp:
    build:
      context: ./frontapp
    container_name: frontapp
    env_file:
      - ./frontapp/.env
    environment:
      - BACKEND_URL=http://sportease-backapp:8080
      - BODY_SIZE_LIMIT=10M
      - ORIGIN=https://nitsche-gyouji.com
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
      - PORT=3000
    depends_on:
      sportease-backapp:
        condition: service_healthy
    networks:
      - proxy
      - spotease-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sportease-public"
      - "traefik.http.routers.sportease-frontend.rule=Host(`nitsche-gyouji.com`)"
      - "traefik.http.routers.sportease-frontend.entrypoints=websecure"
      - "traefik.http.routers.sportease-frontend.tls=true"
      - "traefik.http.routers.sportease-frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.sportease-frontend.middlewares=security-headers@file"
      - "traefik.http.routers.sportease-frontend.service=sportease-frontend"
      - "traefik.http.services.sportease-frontend.loadbalancer.server.port=3000"

networks:
  proxy:
    name: sportease-public
    external: true
  spotease-internal:
    name: sportease-internal
    external: true

volumes:
  db-data:
  uploads-data:
